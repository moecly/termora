name: termora
description: "Termora — a fast, modern SSH client"
publish_to: 'none'

version: 1.0.3+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.2.0
  dartssh2: ^4.1.0
  xterm2: ^5.3.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.0.3
  share_plus: ^13.0.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
